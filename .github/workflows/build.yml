name: Build Flet APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  UV_PYTHON: "3.14"
  PYTHONUTF8: "1"

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Configurar Python e uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Gerar APK
        run: |
          uv run flet build apk --yes --verbose

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: pong-apk
          path: build/apk
          if-no-files-found: error
          overwrite: true